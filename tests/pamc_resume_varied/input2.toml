# Reference: the same run in one shot (no checkpoint, no delay).
[base]
dimension = 1
output_dir = "output2"

[algorithm]
name = "pamc"
seed = 1

[algorithm.param]
min_list = [-10.0]
max_list = [10.0]
step_list = [0.25]

[algorithm.pamc]
numsteps_annealing = 5
Tnum = 21
bmin = 0.0
bmax = 10.0
Tlogspace = false
nreplica_per_proc = 2
fix_num_replicas = false
resampling_interval = 1

[solver]
name = "analytical"
function_name = "quadratics"
